<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — CloudBot AI</title>
    <meta name="description" content="Sign in to CloudBot AI — Your AI-powered customer support assistant." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{--bg:#0d1117;--card-bg:rgba(22,27,34,0.85);--border:rgba(255,255,255,0.08);--accent:#6c63ff;--accent-2:#a78bfa;--text:#e6edf3;--muted:#8b949e;--input-bg:rgba(255,255,255,0.05);--input-border:rgba(255,255,255,0.1);--input-focus:rgba(108,99,255,0.5);--danger:#ef4444;--success:#10b981}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden;position:relative}
        .bg-orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
        .orb{position:absolute;border-radius:50%;filter:blur(120px);opacity:.15;animation:floatOrb 12s ease-in-out infinite alternate}
        .orb-1{width:600px;height:600px;background:radial-gradient(circle,#6c63ff,transparent);top:-200px;left:-100px;animation-duration:10s}
        .orb-2{width:500px;height:500px;background:radial-gradient(circle,#a78bfa,transparent);bottom:-150px;right:-100px;animation-duration:14s;animation-delay:-5s}
        .orb-3{width:300px;height:300px;background:radial-gradient(circle,#3b82f6,transparent);top:50%;left:50%;transform:translate(-50%,-50%);animation-duration:8s;animation-delay:-2s}
        @keyframes floatOrb{from{transform:scale(1) translate(0,0);opacity:.12}to{transform:scale(1.25) translate(30px,-30px);opacity:.22}}
        .bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
        .card{position:relative;z-index:1;width:100%;max-width:420px;background:var(--card-bg);border:1px solid var(--border);border-radius:24px;padding:40px 36px;backdrop-filter:blur(24px);box-shadow:0 24px 80px rgba(0,0,0,.6),0 0 0 1px rgba(108,99,255,.08);animation:cardIn .6s cubic-bezier(.22,1,.36,1) forwards}
        @keyframes cardIn{from{opacity:0;transform:translateY(32px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
        .logo-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:32px;text-align:center}
        .logo-icon{width:60px;height:60px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:14px;box-shadow:0 0 30px rgba(108,99,255,.4);animation:glowPulse 3s ease-in-out infinite alternate}
        @keyframes glowPulse{from{box-shadow:0 0 20px rgba(108,99,255,.35)}to{box-shadow:0 0 40px rgba(167,139,250,.65)}}
        .logo-title{font-size:24px;font-weight:800;background:linear-gradient(135deg,#fff,var(--accent-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .logo-sub{font-size:13px;color:var(--muted);margin-top:5px}
        .tabs{display:flex;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:28px}
        .tab-btn{flex:1;padding:9px;border:none;border-radius:9px;background:transparent;color:var(--muted);font-size:13.5px;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer;transition:all .25s ease}
        .tab-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:white;box-shadow:0 4px 12px rgba(108,99,255,.35)}
        .form-panel{display:none}
        .form-panel.active{display:block;animation:fadeSlide .3s ease}
        @keyframes fadeSlide{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}
        .input-group{margin-bottom:16px}
        .input-group label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.05em}
        .input-wrapper{position:relative;display:flex;align-items:center}
        .input-icon{position:absolute;left:14px;color:var(--muted);font-size:14px;pointer-events:none;transition:color .2s}
        .input-group input{width:100%;padding:12px 14px 12px 40px;background:var(--input-bg);border:1.5px solid var(--input-border);border-radius:10px;color:var(--text);font-size:14.5px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s,box-shadow .2s}
        .input-group input:focus{border-color:var(--input-focus);box-shadow:0 0 0 3px rgba(108,99,255,.15)}
        .input-wrapper:focus-within .input-icon{color:var(--accent-2)}
        .input-group input::placeholder{color:rgba(139,148,158,.6)}
        .pw-toggle{position:absolute;right:13px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:4px;transition:color .2s}
        .pw-toggle:hover{color:var(--text)}
        .options-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;margin-top:-4px}
        .remember-me{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;color:var(--muted);user-select:none}
        .remember-me input[type="checkbox"]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
        .forgot-link{font-size:13px;color:var(--accent-2);text-decoration:none;transition:opacity .2s}
        .forgot-link:hover{opacity:.75;text-decoration:underline}
        .submit-btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;border-radius:12px;color:white;font-size:15px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;transition:all .25s ease;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden;box-shadow:0 6px 20px rgba(108,99,255,.35)}
        .submit-btn:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(108,99,255,.45)}
        .submit-btn:active{transform:translateY(0) scale(.98)}
        .btn-spinner{display:none;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--muted);font-size:12px}
        .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
        .social-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .social-btn{padding:10px 14px;background:var(--input-bg);border:1.5px solid var(--input-border);border-radius:10px;color:var(--text);font-size:13.5px;font-family:'Inter',sans-serif;font-weight:500;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
        .social-btn:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);transform:translateY(-1px)}
        .social-btn .fab{font-size:16px}
        .social-btn .fa-google{color:#ea4335}
        .social-btn .fa-github{color:#e6edf3}
        .alert{display:none;padding:11px 14px;border-radius:10px;font-size:13px;margin-bottom:18px;align-items:center;gap:8px;animation:fadeSlide .3s ease}
        .alert.show{display:flex}
        .alert.error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#fca5a5}
        .alert.success-alert{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.25);color:#6ee7b7}
        .demo-hint{margin-top:20px;padding:12px 14px;background:rgba(108,99,255,.08);border:1px solid rgba(108,99,255,.2);border-radius:10px;font-size:12.5px;color:var(--muted);line-height:1.6;text-align:center}
        .demo-hint strong{color:var(--accent-2)}
        .card-footer{text-align:center;margin-top:24px;font-size:12px;color:var(--muted)}
        .card-footer a{color:var(--accent-2);text-decoration:none}
        .card-footer a:hover{text-decoration:underline}
        .success-screen{display:none;flex-direction:column;align-items:center;text-align:center;padding:20px 0 10px;animation:fadeSlide .4s ease}
        .success-screen.show{display:flex}
        .success-icon{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#10b981,#34d399);display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:16px;box-shadow:0 0 30px rgba(16,185,129,.4);animation:popIn .4s cubic-bezier(.34,1.56,.64,1)}
        @keyframes popIn{from{transform:scale(0)}to{transform:scale(1)}}
        .success-screen h2{font-size:20px;margin-bottom:6px}
        .success-screen p{color:var(--muted);font-size:14px}
        .progress-bar-wrap{width:100%;height:3px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:22px;overflow:hidden}
        .progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:2px;animation:fillBar 1.8s ease forwards}
        @keyframes fillBar{from{width:0%}to{width:100%}}
        @media(max-width:460px){.card{padding:30px 22px}.logo-title{font-size:20px}.social-btns{grid-template-columns:1fr}}
    </style>
</head>
<body>
<div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
<div class="bg-grid"></div>

<div class="card" id="auth-card">
    <div class="logo-wrap">
        <div class="logo-icon">🤖</div>
        <div class="logo-title">CloudBot AI</div>
        <div class="logo-sub">Powered by Gemini 3.6 · Built by Tarun</div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="tab-signin" onclick="switchTab('signin')">Sign In</button>
        <button class="tab-btn" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <div class="alert" id="alert-box">
        <i class="fas fa-circle-exclamation"></i>
        <span id="alert-text"></span>
    </div>

    <!-- SIGN IN -->
    <div class="form-panel active" id="panel-signin">
        <div class="input-group">
            <label for="signin-email">Email Address</label>
            <div class="input-wrapper">
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" id="signin-email" placeholder="you@example.com" autocomplete="email" />
            </div>
        </div>
        <div class="input-group">
            <label for="signin-password">Password</label>
            <div class="input-wrapper">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="signin-password" placeholder="Enter your password" autocomplete="current-password" />
                <button class="pw-toggle" type="button" onclick="togglePw('signin-password',this)"><i class="fas fa-eye"></i></button>
            </div>
        </div>
        <div class="options-row">
            <label class="remember-me"><input type="checkbox" id="remember-me" /> Remember me</label>
            <a href="#" class="forgot-link" onclick="showForgot();return false;">Forgot password?</a>
        </div>
        <button class="submit-btn" id="signin-btn" onclick="handleSignIn()">
            <div class="btn-spinner" id="signin-spinner"></div>
            <i class="fas fa-arrow-right-to-bracket" id="signin-icon"></i>
            <span id="signin-label">Sign In</span>
        </button>
        <div class="divider">or continue with</div>
        <div class="social-btns">
            <button class="social-btn" onclick="socialLogin('Google')"><i class="fab fa-google"></i> Google</button>
            <button class="social-btn" onclick="socialLogin('GitHub')"><i class="fab fa-github"></i> GitHub</button>
        </div>
        <div class="demo-hint">🔑 <strong>Demo credentials</strong><br/>Email: <strong>demo@cloudbot.ai</strong> &nbsp;|&nbsp; Password: <strong>demo1234</strong></div>
    </div>

    <!-- SIGN UP -->
    <div class="form-panel" id="panel-signup">
        <div class="input-group">
            <label for="signup-name">Full Name</label>
            <div class="input-wrapper">
                <i class="fas fa-user input-icon"></i>
                <input type="text" id="signup-name" placeholder="Your full name" autocomplete="name" />
            </div>
        </div>
        <div class="input-group">
            <label for="signup-email">Email Address</label>
            <div class="input-wrapper">
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" id="signup-email" placeholder="you@example.com" autocomplete="email" />
            </div>
        </div>
        <div class="input-group">
            <label for="signup-password">Password</label>
            <div class="input-wrapper">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="signup-password" placeholder="At least 6 characters" autocomplete="new-password" />
                <button class="pw-toggle" type="button" onclick="togglePw('signup-password',this)"><i class="fas fa-eye"></i></button>
            </div>
        </div>
        <div class="input-group">
            <label for="signup-confirm">Confirm Password</label>
            <div class="input-wrapper">
                <i class="fas fa-shield-halved input-icon"></i>
                <input type="password" id="signup-confirm" placeholder="Repeat your password" autocomplete="new-password" />
            </div>
        </div>
        <button class="submit-btn" id="signup-btn" onclick="handleSignUp()" style="margin-top:4px">
            <div class="btn-spinner" id="signup-spinner"></div>
            <i class="fas fa-user-plus" id="signup-icon"></i>
            <span id="signup-label">Create Account</span>
        </button>
        <div class="divider">or sign up with</div>
        <div class="social-btns">
            <button class="social-btn" onclick="socialLogin('Google')"><i class="fab fa-google"></i> Google</button>
            <button class="social-btn" onclick="socialLogin('GitHub')"><i class="fab fa-github"></i> GitHub</button>
        </div>
    </div>

    <!-- SUCCESS -->
    <div class="success-screen" id="success-screen">
        <div class="success-icon">✓</div>
        <h2 id="success-title">Welcome back!</h2>
        <p id="success-sub">Redirecting you to CloudBot…</p>
        <div class="progress-bar-wrap"><div class="progress-bar-fill"></div></div>
    </div>

    <div class="card-footer">By signing in you agree to our <a href="#">Terms of Service</a> &amp; <a href="#">Privacy Policy</a>.</div>
</div>

<script>
if(localStorage.getItem('cloudbot_user')){window.location.href='index.html';}

function switchTab(tab){
    ['signin','signup'].forEach(t=>{
        document.getElementById('tab-'+t).classList.toggle('active',t===tab);
        document.getElementById('panel-'+t).classList.toggle('active',t===tab);
    });
    hideAlert();
}

function togglePw(id,btn){
    const input=document.getElementById(id);
    const icon=btn.querySelector('i');
    if(input.type==='password'){input.type='text';icon.className='fas fa-eye-slash';}
    else{input.type='password';icon.className='fas fa-eye';}
}

function showAlert(msg,type='error'){
    const box=document.getElementById('alert-box');
    box.className='alert '+(type==='success'?'success-alert':'error')+' show';
    document.getElementById('alert-text').textContent=msg;
}
function hideAlert(){document.getElementById('alert-box').classList.remove('show');}

function setLoading(prefix,loading){
    document.getElementById(prefix+'-spinner').style.display=loading?'block':'none';
    document.getElementById(prefix+'-icon').style.display=loading?'none':'inline';
    document.getElementById(prefix+'-label').textContent=loading?(prefix==='signin'?'Signing in…':'Creating account…'):(prefix==='signin'?'Sign In':'Create Account');
    document.getElementById(prefix+'-btn').disabled=loading;
}

function handleSignIn(){
    hideAlert();
    const email=document.getElementById('signin-email').value.trim();
    const password=document.getElementById('signin-password').value;
    const remember=document.getElementById('remember-me').checked;
    if(!email) return showAlert('Please enter your email address.');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showAlert('Please enter a valid email address.');
    if(!password) return showAlert('Please enter your password.');
    setLoading('signin',true);
    setTimeout(()=>{
        setLoading('signin',false);
        const DEMO={email:'demo@cloudbot.ai',password:'demo1234',name:'Demo User'};
        const users=JSON.parse(localStorage.getItem('cloudbot_users')||'[]');
        const user=users.find(u=>u.email===email&&u.password===password);
        if((email===DEMO.email&&password===DEMO.password)||user){
            const ud=user||DEMO;
            localStorage.setItem('cloudbot_user',JSON.stringify({name:ud.name,email:ud.email,remember}));
            showSuccess('Welcome back, '+ud.name.split(' ')[0]+'! 👋','Redirecting you to CloudBot…');
        } else {
            showAlert('Invalid email or password. Try the demo credentials below.');
        }
    },1200);
}

function handleSignUp(){
    hideAlert();
    const name=document.getElementById('signup-name').value.trim();
    const email=document.getElementById('signup-email').value.trim();
    const password=document.getElementById('signup-password').value;
    const confirm=document.getElementById('signup-confirm').value;
    if(!name) return showAlert('Please enter your full name.');
    if(!email) return showAlert('Please enter your email address.');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showAlert('Please enter a valid email address.');
    if(password.length<6) return showAlert('Password must be at least 6 characters.');
    if(password!==confirm) return showAlert('Passwords do not match.');
    setLoading('signup',true);
    setTimeout(()=>{
        setLoading('signup',false);
        const users=JSON.parse(localStorage.getItem('cloudbot_users')||'[]');
        if(users.find(u=>u.email===email)) return showAlert('An account with this email already exists.');
        users.push({name,email,password});
        localStorage.setItem('cloudbot_users',JSON.stringify(users));
        localStorage.setItem('cloudbot_user',JSON.stringify({name,email}));
        showSuccess('Account created! Welcome, '+name.split(' ')[0]+'! 🎉','Setting up your workspace…');
    },1400);
}

function socialLogin(provider){
    const demoUser={name:provider+' User',email:'user@'+provider.toLowerCase()+'.com'};
    localStorage.setItem('cloudbot_user',JSON.stringify(demoUser));
    showSuccess('Signed in with '+provider+'!','Redirecting to CloudBot…');
}

function showForgot(){
    const email=document.getElementById('signin-email').value.trim();
    if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
        showAlert('Enter your email address first, then click "Forgot password?".');
    } else {
        showAlert('📧 A reset link has been sent to '+email+' (demo mode)','success');
    }
}

function showSuccess(title,sub){
    document.querySelectorAll('.tabs,.form-panel,.alert,.demo-hint,.card-footer').forEach(el=>el.style.display='none');
    document.querySelector('.logo-wrap').style.display='none';
    const screen=document.getElementById('success-screen');
    document.getElementById('success-title').textContent=title;
    document.getElementById('success-sub').textContent=sub;
    screen.classList.add('show');
    setTimeout(()=>{window.location.href='index.html';},2000);
}

document.addEventListener('keydown',e=>{
    if(e.key!=='Enter') return;
    if(document.getElementById('panel-signin').classList.contains('active')) handleSignIn();
    else handleSignUp();
});
</script>
</body>
</html>
